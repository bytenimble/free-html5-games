<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake (HTML5 canvas)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f0c; color: #e8ffe8; font: 16px system-ui, sans-serif; overflow: hidden; touch-action: none; }
  canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ----- Settings -----
const COLS = 20, ROWS = 20;          // board size in cells
const START_SPEED = 7;               // moves per second at the start
const SPEED_STEP = 0.35;             // extra moves per second for each apple eaten
const COLORS = { board: "#101a12", grid: "#14231a", snake: "#19ef76", head: "#b6ffd2", apple: "#ff5c5c", text: "#e8ffe8" };

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let cell = 20;                       // pixel size of one cell, set by resize()
let offsetY = 0;                     // room at the top for the score

// ----- Sizing: fill the window, keep square cells, stay sharp on high-DPI screens -----
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const hud = 40;
  cell = Math.max(8, Math.floor(Math.min(window.innerWidth / COLS, (window.innerHeight - hud) / ROWS)));
  const w = cell * COLS, h = cell * ROWS + hud;
  offsetY = hud;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

// ----- Game state -----
let snake, dir, nextDir, apple, score, best = 0, state, speed, timer = 0, last = 0;

function reset() {
  const mid = Math.floor(ROWS / 2);
  snake = [{ x: 5, y: mid }, { x: 4, y: mid }, { x: 3, y: mid }];
  dir = { x: 1, y: 0 };
  nextDir = dir;
  score = 0;
  speed = START_SPEED;
  placeApple();
  state = "ready";                   // ready → playing → over
}

function placeApple() {
  // Pick a random free cell (the board always has one until the snake fills it).
  const free = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
  }
  apple = free[Math.floor(Math.random() * free.length)];
}

function turn(x, y) {
  if (state === "ready") state = "playing";
  if (state === "over") { reset(); state = "playing"; }
  // No reversing straight into yourself: compare against the direction actually moved last.
  if (x === -dir.x && y === -dir.y) return;
  nextDir = { x, y };
}

// ----- One step of the simulation -----
function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const hitsWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
  // The tail moves away this step, so only the rest of the body can be hit.
  const hitsSelf = snake.slice(0, -1).some((s) => s.x === head.x && s.y === head.y);
  if (hitsWall || hitsSelf) {
    state = "over";
    best = Math.max(best, score);
    return;
  }
  snake.unshift(head);
  if (head.x === apple.x && head.y === apple.y) {
    score++;
    speed += SPEED_STEP;
    if (snake.length === COLS * ROWS) { state = "over"; best = Math.max(best, score); return; }
    placeApple();
  } else {
    snake.pop();
  }
}

// ----- Drawing -----
function draw() {
  const w = cell * COLS;
  ctx.fillStyle = "#0b0f0c";
  ctx.fillRect(0, 0, w, offsetY);
  ctx.fillStyle = COLORS.board;
  ctx.fillRect(0, offsetY, w, cell * ROWS);
  ctx.fillStyle = COLORS.grid;
  for (let y = 0; y < ROWS; y++) for (let x = (y % 2); x < COLS; x += 2) ctx.fillRect(x * cell, offsetY + y * cell, cell, cell);

  if (!snake) return;
  const pad = Math.max(1, Math.floor(cell * 0.08));
  ctx.fillStyle = COLORS.apple;
  ctx.beginPath();
  ctx.arc(apple.x * cell + cell / 2, offsetY + apple.y * cell + cell / 2, cell / 2 - pad, 0, Math.PI * 2);
  ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? COLORS.head : COLORS.snake;
    ctx.fillRect(s.x * cell + pad, offsetY + s.y * cell + pad, cell - pad * 2, cell - pad * 2);
  });

  ctx.fillStyle = COLORS.text;
  ctx.font = `600 ${Math.min(20, Math.max(14, cell * 0.8))}px system-ui, sans-serif`;
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.fillText(`Score ${score}`, 10, offsetY / 2);
  ctx.textAlign = "right";
  ctx.fillText(`Best ${best}`, w - 10, offsetY / 2);

  if (state !== "playing") {
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(0, offsetY, w, cell * ROWS);
    ctx.fillStyle = COLORS.text;
    ctx.textAlign = "center";
    const cx = w / 2, cy = offsetY + (cell * ROWS) / 2;
    ctx.font = `700 ${Math.max(18, cell * 1.2)}px system-ui, sans-serif`;
    ctx.fillText(state === "over" ? "Game over" : "Snake", cx, cy - cell);
    ctx.font = `500 ${Math.max(13, cell * 0.7)}px system-ui, sans-serif`;
    ctx.fillText("Arrows / WASD or swipe to play", cx, cy + cell * 0.6);
  }
}

// ----- Main loop: fixed-rate steps, smooth drawing -----
function loop(now) {
  const dt = Math.min(0.25, (now - last) / 1000);
  last = now;
  if (state === "playing") {
    timer += dt;
    while (timer >= 1 / speed && state === "playing") { timer -= 1 / speed; step(); }
  }
  draw();
  requestAnimationFrame(loop);
}

// ----- Input: keyboard, swipe and tap -----
const KEYS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
window.addEventListener("keydown", (e) => {
  const d = KEYS[e.code];
  if (d) { e.preventDefault(); turn(d[0], d[1]); }
  else if ((e.code === "Space" || e.code === "Enter") && state !== "playing") { e.preventDefault(); turn(dir.x, dir.y); }
});

let touchStart = null;
canvas.addEventListener("pointerdown", (e) => { touchStart = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener("pointerup", (e) => {
  if (!touchStart) return;
  const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) { if (state !== "playing") turn(dir.x, dir.y); return; }
  if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
});

window.addEventListener("resize", resize);
reset();
resize();
requestAnimationFrame((t) => { last = t; loop(t); });
</script>
</body>
</html>
