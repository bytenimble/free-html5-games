<!-- Sunset Sprint: a pseudo-3D car racing game in one HTML file. Free to use, change and ship (MIT license). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Sprint (HTML5 car racing game)</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1430; color: #fff; font: 16px system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ----- Settings -----
const SEG = 200;                     // length of one road segment, in world units
const ROAD = 1000;                   // half the road width
const LANES = 3;
const CAM_HEIGHT = 1000;             // camera height above the road
const DEPTH = 1 / Math.tan((100 / 2) * Math.PI / 180); // 100° field of view
const PLAYER_Z = CAM_HEIGHT * DEPTH; // distance from the camera to the car (puts it at the bottom of the screen)
const DRAW = 180;                    // segments drawn ahead
const MAX_SPEED = SEG * 50;          // top speed: 50 segments a second
const ACCEL = MAX_SPEED / 4;         // 0 to top speed in about 4 seconds
const BRAKE = MAX_SPEED;             // braking is four times stronger
const GRASS_MAX = MAX_SPEED / 4;     // top speed on the grass
const STEER = 2.2;                   // road half-widths per second at full speed
const DRIFT = 0.3;                   // how hard curves push the car outwards
const CAR_W = 0.36;                  // car width as a fraction of the road half-width
const LAPS = 3, TRAFFIC = 22;
// The track: [segments, curve (+ right, - left), height change]. Height changes must add up to 0.
const TRACK = [
  [60, 0, 0], [80, 2, 0], [60, 0, 1200], [90, -4, 0], [60, 0, -1200], [100, 3, 1600], [60, 0, 0],
  [80, -3, -1600], [50, 0, 0], [80, 5, 0], [60, 0, 800], [90, -2, -800], [80, 4, 0], [70, 0, 0],
];

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ----- Build the road: a list of short segments, each with a curve and a start and end height -----
const segments = [];
for (const [count, curve, rise] of TRACK) {
  const startY = segments.length ? segments[segments.length - 1].y2 : 0;
  for (let i = 0; i < count; i++) {
    const ease = Math.min(1, (i + 1) / (count / 4), (count - i) / (count / 4)); // curves fade in and out
    const y1 = segments.length ? segments[segments.length - 1].y2 : 0;
    const y2 = startY + rise * (1 - Math.cos(Math.PI * (i + 1) / count)) / 2;  // smooth hills
    segments.push({ curve: curve * ease, y1, y2 });
  }
}
const N = segments.length, TRACK_LEN = N * SEG;
const START = Math.floor(PLAYER_Z / SEG); // the chequered line sits under the car at the start

// ----- Game state -----
let state = "ready";                 // ready → countdown → racing → finished
let position, distance, speed, playerX, cars, raceTime, lapTime, lapTimes, countdown, bump, endedAt = 0;
let best = 0, bestLap = 0, hills = 0, last = 0;
const keys = {}, pointers = new Map();
let touchUsed = false, steerNow = 0;

function reset() {
  position = 0; distance = 0; speed = 0; playerX = 0; bump = 0;
  raceTime = 0; lapTime = 0; lapTimes = []; countdown = 3;
  // Traffic: spread along the track, never close to the start line.
  const colors = ["#3fa7ff", "#ffd23f", "#9b5de5", "#f15bb5", "#00c49a", "#ff8c42"];
  cars = [];
  for (let i = 0; i < TRAFFIC; i++) {
    cars.push({
      z: (30 + (i + Math.random() * 0.5) * (N - 110) / TRAFFIC) * SEG,
      x: (Math.floor(Math.random() * LANES) - 1) * (2 / LANES),   // lane centres: -2/3, 0, 2/3
      speed: MAX_SPEED * (0.35 + Math.random() * 0.25),
      color: colors[i % colors.length],
    });
  }
}

function start() {
  if (state === "ready" || (state === "finished" && performance.now() - endedAt > 1000)) { reset(); state = "countdown"; }
}

// ----- Update: speed, steering, curves, traffic and laps -----
function update(dt) {
  if (state === "countdown") { countdown -= dt; if (countdown <= 0) state = "racing"; return; }
  for (const c of cars) c.z = (c.z + c.speed * dt) % TRACK_LEN;
  if (state !== "racing") return;

  // Input: keys, or touch/mouse on the left or right half. Both halves at once = brake.
  let pl = false, pr = false;
  for (const px of pointers.values()) { if (px < W / 2) pl = true; else pr = true; }
  const braking = keys.brake || (pl && pr);
  const steer = (keys.right || (pr && !pl) ? 1 : 0) - (keys.left || (pl && !pr) ? 1 : 0);
  steerNow = steer;

  const pct = speed / MAX_SPEED;
  const seg = segments[Math.floor((position + PLAYER_Z) / SEG) % N];
  playerX += steer * STEER * pct * dt;              // steering works better the faster you go
  playerX -= seg.curve * DRIFT * pct * pct * dt;    // curves push you to the outside
  playerX = Math.max(-1.8, Math.min(1.8, playerX));

  // The car accelerates by itself; the player only steers and brakes.
  speed += (braking ? -BRAKE : ACCEL) * dt;
  if (Math.abs(playerX) > 1 && speed > GRASS_MAX) speed -= MAX_SPEED * 1.5 * dt; // grass slows you down
  speed = Math.max(0, Math.min(MAX_SPEED, speed));

  // Traffic: hitting a slower car from behind drops you to half its speed.
  const pz = (position + PLAYER_Z) % TRACK_LEN;
  for (const c of cars) {
    const gap = (c.z - pz + TRACK_LEN) % TRACK_LEN;          // how far ahead the car is
    const overlap = Math.abs(playerX - c.x) < CAR_W;
    if (overlap && speed > c.speed && gap < 80 + (speed - c.speed) * dt) { speed = c.speed * 0.5; bump = 0.4; }
    else if (overlap && TRACK_LEN - gap < 80 && c.speed > speed) c.z = (pz - 80 + TRACK_LEN) % TRACK_LEN; // a car behind waits
  }

  // Laps are counted from the total distance driven, so nothing can count a lap twice.
  const lapsBefore = Math.floor(distance / TRACK_LEN);
  distance += speed * dt;
  position = distance % TRACK_LEN;
  raceTime += dt; lapTime += dt;
  if (Math.floor(distance / TRACK_LEN) > lapsBefore) {
    lapTimes.push(lapTime);
    bestLap = bestLap ? Math.min(bestLap, lapTime) : lapTime;
    lapTime = 0;
    if (lapTimes.length === LAPS) {
      state = "finished"; endedAt = performance.now();
      best = best ? Math.min(best, raceTime) : raceTime;
    }
  }
  hills -= seg.curve * pct * dt * 0.06;            // the scenery slides the opposite way on curves
  bump = Math.max(0, bump - dt);
}

// ----- Projection: world point → screen point -----
function project(worldX, worldY, z, camX, camY) {
  const scale = DEPTH / z;
  return { x: W / 2 + scale * (worldX - camX) * W / 2, y: H / 2 - scale * (worldY - camY) * H / 2, w: scale * ROAD * W / 2 };
}

// A trapezoid from a near edge (a) to a far edge (b). `overlap` pushes the far edge up a pixel
// so neighbouring segments overlap and no hairline seams show between them.
function quad(a, b, wa, wb, color, overlap = 1) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(a.x - wa, a.y); ctx.lineTo(a.x + wa, a.y);
  ctx.lineTo(b.x + wb, b.y - overlap); ctx.lineTo(b.x - wb, b.y - overlap);
  ctx.fill();
}

// A car seen from behind; used for the player and for traffic.
function drawCar(x, y, w, color, tilt) {
  const h = w * 0.55;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
  ctx.fillStyle = "#111";
  ctx.fillRect(-w * 0.48, -h * 0.3, w * 0.18, h * 0.3); ctx.fillRect(w * 0.3, -h * 0.3, w * 0.18, h * 0.3);
  ctx.fillStyle = color;
  ctx.fillRect(-w / 2, -h * 0.78, w, h * 0.55);
  ctx.fillRect(-w * 0.34, -h, w * 0.68, h * 0.3);
  ctx.fillStyle = "rgba(25, 30, 60, 0.85)"; ctx.fillRect(-w * 0.27, -h * 0.94, w * 0.54, h * 0.2);
  ctx.fillStyle = "#ff3b30";
  ctx.fillRect(-w * 0.46, -h * 0.66, w * 0.14, h * 0.12); ctx.fillRect(w * 0.32, -h * 0.66, w * 0.14, h * 0.12);
  ctx.restore();
}

function drawHills(offset, height, color, freq) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 10; x += 10) {
    const t = x / W * freq + offset;
    ctx.lineTo(x, H / 2 - height * (0.55 + 0.3 * Math.sin(t) + 0.15 * Math.sin(t * 2.7)));
  }
  ctx.lineTo(W, H); ctx.fill();
}

function draw() {
  // Sky, sun and two layers of hills that scroll at different speeds (parallax).
  const sky = ctx.createLinearGradient(0, 0, 0, H / 2);
  sky.addColorStop(0, "#2b1b55"); sky.addColorStop(1, "#ff8a5c");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#ffd36b"; ctx.beginPath(); ctx.arc(W * 0.5, H / 2 - H * 0.04, Math.min(W, H) * 0.1, 0, Math.PI * 2); ctx.fill();
  drawHills(hills * 0.5, H * 0.12, "#6a3b6e", 4);
  drawHills(hills, H * 0.07, "#3d2a4f", 7);

  // Project the road from near to far, accumulating the curve as we go.
  const baseIndex = Math.floor(position / SEG) % N;
  const basePct = (position % SEG) / SEG;
  const pSeg = segments[Math.floor((position + PLAYER_Z) / SEG) % N];
  const pPct = ((position + PLAYER_Z) % SEG) / SEG;
  const camY = pSeg.y1 + (pSeg.y2 - pSeg.y1) * pPct + CAM_HEIGHT;
  const camX = playerX * ROAD;
  let x = 0, dx = -segments[baseIndex].curve * basePct;
  const visible = [];
  for (let n = 0; n < DRAW; n++) {
    const i = (baseIndex + n) % N, seg = segments[i];
    const z1 = i * SEG + (i < baseIndex ? TRACK_LEN : 0) - position;  // segments past the finish wrap round
    const a = project(x, seg.y1, z1, camX, camY), b = project(x + dx, seg.y2, z1 + SEG, camX, camY);
    x += dx; dx += seg.curve;
    if (z1 > 10 && b.y < a.y) visible.push({ i, a, b });
  }

  // Draw far to near, so nearer road (and hills) cover whatever is behind them.
  const carsBySeg = new Map();
  for (const c of cars) { const i = Math.floor(c.z / SEG); if (!carsBySeg.has(i)) carsBySeg.set(i, []); carsBySeg.get(i).push(c); }
  for (let k = visible.length - 1; k >= 0; k--) {
    const { i, a, b } = visible[k], light = Math.floor(i / 3) % 2 === 0;
    ctx.fillStyle = light ? "#3f8d3c" : "#377f35";
    ctx.fillRect(0, b.y, W, a.y - b.y + 1);
    quad(a, b, a.w * 1.12, b.w * 1.12, light ? "#f2f2f2" : "#d23b30", 0);
    quad(a, b, a.w, b.w, light ? "#6d6b74" : "#66646d");
    const finish = i === START || i === START + 1;
    if (finish) for (let col = 0; col < 8; col++) {           // chequered start/finish line
      const off = -0.875 + col * 0.25;
      quad({ x: a.x + off * a.w, y: a.y }, { x: b.x + off * b.w, y: b.y }, a.w * 0.125, b.w * 0.125, (col + i) % 2 ? "#fafafa" : "#222");
    }
    else if (light) for (let l = 1; l < LANES; l++) {
      const off = -1 + (2 * l) / LANES;
      quad({ x: a.x + off * a.w, y: a.y }, { x: b.x + off * b.w, y: b.y }, a.w * 0.02, b.w * 0.02, "#f5f0e0");
    }
    for (const c of carsBySeg.get(i) || []) {
      const t = (c.z % SEG) / SEG, w = a.w + (b.w - a.w) * t;
      if (w > 3) drawCar(a.x + (b.x - a.x) * t + c.x * w, a.y + (b.y - a.y) * t, CAR_W * w, c.color, 0);
    }
  }

  // The player's car: always at the bottom centre; the world moves around it.
  const carW = Math.min(W * 0.2, H * 0.3);
  const shake = bump > 0 ? (Math.random() - 0.5) * 6 : Math.abs(playerX) > 1 ? (Math.random() - 0.5) * 3 * (speed / MAX_SPEED) : 0;
  drawCar(W / 2 + shake, H - 10 + Math.sin(raceTime * 40) * (speed / MAX_SPEED), carW, "#e63946", state === "racing" ? steerNow * 0.04 : 0);

  drawHud();
}

// 83.4 seconds → "1:23.4"
const time = (s) => { const t = Math.floor(s * 10); return `${Math.floor(t / 600)}:${String(Math.floor(t / 10) % 60).padStart(2, "0")}.${t % 10}`; };

function label(str, x, y, size, align = "center", color = "#fff") {
  ctx.font = `700 ${size}px system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = "middle";
  ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0, 0, 0, 0.55)"; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function drawHud() {
  const s = Math.min(1, W / 480);
  label(`Lap ${Math.min(LAPS, lapTimes.length + 1)}/${LAPS}`, 14, 24, 20 * s, "left");
  label(time(raceTime), W / 2, 24, 24 * s);
  label(`${Math.round((speed / MAX_SPEED) * 240)} km/h`, W - 14, 24, 20 * s, "right");
  if (bestLap) label(`Best lap ${time(bestLap)}`, W / 2, 52, 14 * s, "center", "#ffe0a8");

  if (touchUsed && state === "racing") {                     // touch hints
    ctx.globalAlpha = 0.25;
    label("◀", W * 0.12, H - 60, 44); label("▶", W * 0.88, H - 60, 44);
    ctx.globalAlpha = 1;
  }
  if (state === "countdown") label(String(Math.ceil(countdown)), W / 2, H * 0.35, 72 * s, "center", "#ffd36b");
  if (state === "racing" && raceTime < 0.7) label("GO!", W / 2, H * 0.35, 72 * s, "center", "#ffd36b");
  if (state === "ready" || state === "finished") {
    ctx.fillStyle = "rgba(20, 10, 35, 0.72)"; ctx.fillRect(0, 0, W, H);
    const cy = H * 0.42;
    if (state === "ready") {
      label("Sunset Sprint", W / 2, cy - 70 * s, 44 * s, "center", "#ffd36b");
      label(`${LAPS} laps against the clock. Weave through traffic.`, W / 2, cy - 20 * s, 17 * s);
      label("Keys: ← → steer, ↓ or Space brake", W / 2, cy + 14 * s, 16 * s);
      label("Touch: hold left or right side, both to brake", W / 2, cy + 40 * s, 16 * s);
      label("Tap or press Enter to start", W / 2, cy + 90 * s, 18 * s, "center", "#ffd36b");
    } else {
      label("Finish!", W / 2, cy - 70 * s, 44 * s, "center", "#ffd36b");
      label(`Time ${time(raceTime)}   Best ${time(best)}`, W / 2, cy - 18 * s, 20 * s);
      label(`Laps ${lapTimes.map(time).join("  ")}`, W / 2, cy + 16 * s, 16 * s);
      label("Tap or press Enter to race again", W / 2, cy + 80 * s, 18 * s, "center", "#ffd36b");
    }
  }
}

// ----- Main loop -----
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);   // cap: a background tab must not teleport the car
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ----- Input -----
const KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowDown: "brake", KeyS: "brake", Space: "brake" };
window.addEventListener("keydown", (e) => {
  if (KEYMAP[e.code] || e.code === "Enter" || e.code === "ArrowUp") e.preventDefault();
  if (e.code === "Enter" || e.code === "Space") start();
  if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = true;
});
window.addEventListener("keyup", (e) => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; pointers.clear(); });

canvas.addEventListener("pointerdown", (e) => {
  touchUsed = e.pointerType === "touch";
  pointers.set(e.pointerId, e.clientX);
  start();
});
canvas.addEventListener("pointermove", (e) => { if (pointers.has(e.pointerId)) pointers.set(e.pointerId, e.clientX); });
const lift = (e) => pointers.delete(e.pointerId);
canvas.addEventListener("pointerup", lift);
canvas.addEventListener("pointercancel", lift);

window.addEventListener("resize", resize);
reset();
resize();
requestAnimationFrame((t) => { last = t; loop(t); });
</script>
</body>
</html>
